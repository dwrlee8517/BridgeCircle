<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- BridgeCircle backdrop: Daybreak (dark). The same diagonal warmth translated to ink, glow kept soft. -->
  <defs>
    <linearGradient id="daybreakdark-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#12161f"/><stop offset="0.55" stop-color="#151b28"/><stop offset="1" stop-color="#1a2a47"/>
    </linearGradient>
    <radialGradient id="daybreakdark-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3182f6" stop-opacity="0.20"/><stop offset="1" stop-color="#3182f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#daybreakdark-bg)"/>
  <circle cx="1410" cy="360" r="600" fill="url(#daybreakdark-sun)"/>
  <circle cx="1290" cy="360" r="285" fill="none" stroke="rgba(233,234,236,0.15)" stroke-width="6"/>
  <circle cx="1500" cy="360" r="285" fill="none" stroke="rgba(122,181,255,0.40)" stroke-width="7"/>
</svg>
