# CD — the dev half of the scripted promotion pipeline (ADR 0014).
#
#   push to main
#     └─ wait-for-ci   block until CI is green for this exact commit
#     └─ deploy-dev    dev DB push → web + worker → dev.bridgecircle.org
#     └─ integ         Playwright against the deployed dev stage
#
# Production promotion lives in a SEPARATE workflow (promote.yml), triggered
# by this one concluding green. That split is deliberate: the production
# approval gate can hold a run for days, and while the two halves shared one
# `concurrency` group every later push queued behind the pending approval and
# was cancelled without running a single job. Dev must always drain.
#
# Secrets model: GitHub holds ONLY the two Doppler service tokens.
#   DOPPLER_TOKEN      (repo-level)              → bridgecircle/dev
#   DOPPLER_TOKEN_PRD  (production env secret)   → bridgecircle/prd
# Everything else — RAILWAY_TOKEN included — is injected from the Doppler
# config at runtime via `doppler run`.
#
# Rollout: see docs/architecture/dev-stage-cd-rollout.md. Until Railway
# auto-deploy is switched off in both envs (Phase 3, after this pipeline's
# first green run), deploys are doubled — harmless, same commit.

name: CD

on:
  push:
    branches: [main]
    # Must stay identical to ci.yml's list. wait-for-ci fails closed when no
    # CI run exists for the commit, so a path CD builds but CI skips would
    # deadlock the pipeline.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'product-spec-obsidian-vault/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact SHA to deploy to development
        required: true
        type: string

# Concurrency is per-JOB, not per-workflow (see the 2026-08-14 backlog entry
# "CD self-jams when a production approval is left pending"): a workflow-level
# group also covers a run that is merely waiting, so one unactioned production
# approval silently blocked every later dev deploy. Production now lives in
# promote.yml behind its own `cd-prod` group, and this workflow is the dev
# stage only — deploy-dev + integ share `cd-dev`, declared per job. Do not add
# a workflow-level `concurrency: cd-dev` here: the run would hold the group its
# own jobs are waiting on.

permissions:
  contents: read
  actions: read # wait-for-ci reads the CI run for this commit

env:
  RAILWAY_PROJECT_ID: 07bf44ac-b1e9-4eb0-bbf7-6e61d9626fa1
  RAILWAY_SERVICE: BridgeCircle
  RAILWAY_WORKER_SERVICE: BridgeCircle Worker
  DEV_URL: https://dev.bridgecircle.org

defaults:
  run:
    working-directory: .

jobs:
  wait-for-ci:
    name: Wait for CI
    # A dev-candidate dispatch deploys a hand-picked SHA that CI may never
    # have run against; only the push path is required to be certified.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # CI and CD start from the same push, so the CI run is not
          # registered for the first few seconds. Fail closed: no CI run at
          # all within the grace window means this commit is uncertified and
          # must not reach the dev stage.
          grace_attempts=18
          for attempt in $(seq 1 120); do
            info=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "-") \(.html_url // "-")"' \
              2>/dev/null) || info="unreachable - -"
            read -r status conclusion url <<<"$info"

            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for $GITHUB_SHA — $url"
                  exit 0
                fi
                echo "::error::CI concluded '$conclusion' for $GITHUB_SHA — $url"
                exit 1
                ;;
              missing|unreachable)
                if [ "$attempt" -ge "$grace_attempts" ]; then
                  echo "::error::No CI run found for $GITHUB_SHA after 3 minutes. CD deploys only commits CI has certified — check that ci.yml and cd.yml still share one paths-ignore list."
                  exit 1
                fi
                echo "  attempt $attempt: no CI run registered yet"
                ;;
              *)
                echo "  attempt $attempt: CI is $status — $url"
                ;;
            esac
            sleep 10
          done
          echo "::error::CI did not finish for $GITHUB_SHA within 20 minutes"
          exit 1

  deploy-dev:
    name: Deploy dev stage
    needs: wait-for-ci
    # `skipped` is the workflow_dispatch path, where wait-for-ci does not run.
    if: ${{ !cancelled() && (needs.wait-for-ci.result == 'success' || needs.wait-for-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cd-dev
      # Never cancel a mid-flight dev deploy; queue behind it instead.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate manual development candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$GITHUB_REF" != "refs/heads/codex/ui-ux-iteration-2" ]; then
            echo "::error::Manual CD permits only main or codex/ui-ux-iteration-2"
            exit 1
          fi
          if [ "$REQUESTED_CANDIDATE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::candidate_sha must exactly match the dispatched commit"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: dopplerhq/cli-action@v4

      - run: pnpm --dir app install --frozen-lockfile

      - name: Validate development database target and migration history
        env:
          CUTOVER_SHA: ${{ github.sha }}
          ALLOW_DEV_CANDIDATE_DEPLOY: DEPLOY dev ${{ inputs.candidate_sha }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env -- pnpm --dir app exec tsx scripts/remote-v2-migrations.ts --target=dev --mode=preflight

      - name: Dry-run development migrations
        env:
          CUTOVER_SHA: ${{ github.sha }}
          ALLOW_DEV_CANDIDATE_DEPLOY: DEPLOY dev ${{ inputs.candidate_sha }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env -- pnpm --dir app exec tsx scripts/remote-v2-migrations.ts --target=dev --mode=dry-run

      - name: Apply development migrations
        env:
          CUTOVER_SHA: ${{ github.sha }}
          ALLOW_REMOTE_MIGRATION_PUSH: APPLY dev ${{ github.sha }}
          ALLOW_DEV_CANDIDATE_DEPLOY: DEPLOY dev ${{ inputs.candidate_sha }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env -- pnpm --dir app exec tsx scripts/remote-v2-migrations.ts --target=dev --mode=apply

      - name: Verify development has no pending migrations
        env:
          CUTOVER_SHA: ${{ github.sha }}
          ALLOW_DEV_CANDIDATE_DEPLOY: DEPLOY dev ${{ inputs.candidate_sha }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env -- pnpm --dir app exec tsx scripts/remote-v2-migrations.ts --target=dev --mode=postflight

      - name: Install Railway CLI
        run: |
          npm i -g @railway/cli@5.27.1
          railway --version

      # /api/health reads COMMIT_SHA so the readiness poll (and the integ
      # job) can confirm which commit is actually serving. `railway up`
      # uploads source without git context, so the pipeline stamps the SHA
      # itself. Set BEFORE the up so the new build picks it up;
      # --skip-deploys stops the variable change itself from triggering a
      # second deploy.
      - name: Stamp commit SHA on the dev environment
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --preserve-env -- railway variables \
            --set "COMMIT_SHA=${{ github.sha }}" \
            --service "$RAILWAY_SERVICE" \
            --environment dev \
            --skip-deploys
          doppler run --preserve-env -- railway variables \
            --set "COMMIT_SHA=${{ github.sha }}" \
            --service "$RAILWAY_WORKER_SERVICE" \
            --environment dev \
            --skip-deploys

      - name: Verify private worker targets and variable names
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --preserve-env -- railway variable list \
            --service "$RAILWAY_WORKER_SERVICE" \
            --environment dev \
            --json | jq -e '
              . as $variables |
              $variables.APP_ENV == "dev" and
              $variables.COMMIT_SHA == "${{ github.sha }}" and
              $variables.NEXT_PUBLIC_APP_URL == "https://dev.bridgecircle.org" and
              $variables.NEXT_PUBLIC_SUPABASE_URL == "https://ojpvahiuafdcynbdbmri.supabase.co" and
              ([
                "SUPABASE_SECRET_KEY",
                "RESEND_API_KEY",
                "RESEND_FROM",
                "EMAIL_DEV_ALLOWLIST",
                "ANTHROPIC_API_KEY",
                "VOYAGE_API_KEY"
              ] | all(. as $key | ($variables[$key] | type == "string" and length > 0)))
            ' >/dev/null

      # Blocks until the deploy is live (build + health check) — the job
      # succeeding IS the "dev stage is up" signal.
      - name: railway up → dev
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --preserve-env -- railway up \
            --service "$RAILWAY_SERVICE" \
            --environment dev \
            --ci

      - name: Wait until the dev URL serves this commit
        run: |
          echo "Polling $DEV_URL/api/health for ${{ github.sha }}"
          for i in $(seq 1 60); do
            body=$(curl -sf -m 10 "$DEV_URL/api/health" || true)
            sha=$(echo "$body" | jq -r '.sha' 2>/dev/null || true)
            env=$(echo "$body" | jq -r '.env' 2>/dev/null || true)
            if [ "$sha" = "${{ github.sha }}" ] && [ "$env" = "dev" ]; then
              echo "Dev stage is serving ${{ github.sha }} (env: dev)"
              exit 0
            fi
            echo "  attempt $i/60: serving sha=${sha:-<none>} env=${env:-<none>}"
            sleep 10
          done
          echo "::error::Dev stage never reported ${{ github.sha }} (10 min timeout)"
          exit 1

      # The worker is deliberately source-less and private in Railway. Build a
      # clean app-root archive and replace only its deployment config so web
      # and worker can share one checkout without sharing a start command.
      - name: Prepare private worker source bundle
        run: |
          worker_bundle="$RUNNER_TEMP/bridgecircle-worker"
          mkdir "$worker_bundle"
          cp -R app/. "$worker_bundle/"
          cp app/railway.worker.json "$worker_bundle/railway.json"

      - name: railway up → dev worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --preserve-env -- railway up \
            "$RUNNER_TEMP/bridgecircle-worker" \
            --path-as-root \
            --service "$RAILWAY_WORKER_SERVICE" \
            --environment dev \
            --ci

  integ:
    name: Integ tests vs dev stage
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Shares the dev lane with deploy-dev so a newer run's deploy cannot
    # replace the dev stage underneath an in-flight integ pass.
    concurrency:
      group: cd-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dopplerhq/cli-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # PLAYWRIGHT_BASE_URL is remote, so playwright.config.ts skips its
      # webServer — the suite drives the deployed dev stage. Doppler (dev
      # config) still supplies the Supabase admin credentials the specs use
      # for setup/teardown against the dev database.
      - name: Run integ suite against dev.bridgecircle.org
        env:
          CI: 'true'
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PLAYWRIGHT_BASE_URL: https://dev.bridgecircle.org
        run: doppler run --preserve-env -- pnpm test:e2e

      # In-process teardown dies with crashed or cancelled runs; this sweep
      # removes anything wearing the suite's foundation- prefixes no matter
      # how the run above ended.
      - name: Sweep leaked e2e data on the dev stage
        if: always()
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          E2E_SWEEP_ALLOW_DEV: '1'
        run: doppler run --preserve-env -- pnpm sweep:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integ-report
          path: app/playwright-report
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integ-traces
          path: app/test-results
          retention-days: 14
