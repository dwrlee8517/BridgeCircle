name: E2E

# Hermetic E2E on every PR (see product-spec-obsidian-vault/Vision/Testing
# Suite.md): the suite boots a LOCAL Supabase stack on the runner — migrations
# + the starter-cast seed — and drives the app against it. Env comes from the
# Doppler bridgecircle/dev_local config (local Supabase values + dummied
# outbound services); DOPPLER_TOKEN_LOCAL is a service token scoped to that
# config only. No remote project, nothing deployed. The deployed-stage integ
# run lives in cd.yml.
#
# `e2e-gate` is the job to mark as a REQUIRED status check. It always reports:
# green when the suite passed, or when the PR is docs-only and the suite was
# legitimately skipped. (A paths-ignore skip would leave a required check
# pending forever — this is the always-report gate pattern instead.)
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect docs-only PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # code=true when any changed file is NOT docs/markdown. Manual
      # dispatches have no base to diff against, so they always run.
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "Changed files:"; echo "$files"
          non_docs=$(echo "$files" | grep -vE '(^docs/|^product-spec-obsidian-vault/|\.md$|^\.gitignore$)' || true)
          if [ -n "$non_docs" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    name: Playwright vs local stack (chromium)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dopplerhq/cli-action@v4

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # PARTIAL mitigation, and worth knowing what it does not cover: the
      # Supabase CLI pulls from TWO registries — most of the stack from
      # public.ecr.aws and the rest from docker.io. This login authenticates the
      # docker.io subset only; the public.ecr.aws pulls stay anonymous, and
      # authenticating those would need an AWS account, which is not worth it
      # for the observed impact (see the retry below).
      #
      # Deliberately non-fatal. If the credentials are ever missing, expired, or
      # unavailable (a fork PR gets no secrets), the login is skipped and the
      # pull falls back to anonymous — exactly the old behavior — rather than
      # failing E2E, which is a REQUIRED check on main.
      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Boots Postgres + Auth + PostgREST + Storage + Realtime and applies
      # every migration and seed. Studio and the log pipeline aren't needed
      # for tests.
      #
      # Retried because both registries rate-limit ANONYMOUS pulls per source
      # IP, and runners share those addresses with every other GitHub Actions
      # tenant — so the allowance empties at moments that have nothing to do
      # with this repo. Observed twice (runs 31662794821 and 31827573332,
      # "toomanyrequests: Rate exceeded"); both recovered on their own, and no
      # E2E run has ever actually failed from it. A bounded retry is therefore
      # the proportionate fix: it removes the coin flip without paying to save
      # and restore ~2 GB of images on every run, which would cost more time
      # than the pull it replaces.
      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if pnpm exec supabase start -x studio,imgproxy,vector,logflare; then
              exit 0
            fi
            echo "::warning::supabase start failed (attempt ${attempt}/3) — most likely a throttled image pull; retrying"
            pnpm exec supabase stop || true
            sleep $(( attempt * 20 ))
          done
          echo "::error::supabase start failed 3 times — this is no longer a transient pull throttle"
          exit 1

      # The runner and the nested dev server both resolve env from the
      # bridgecircle/dev_local Doppler config (tests/e2e/helpers/env.ts).
      # The suite's global setup re-runs `supabase db reset` for a
      # guaranteed clean seed.
      - name: Run Playwright suite
        env:
          CI: 'true'
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_LOCAL }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 14

  e2e-gate:
    name: E2E gate
    needs: [changes, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          suite="${{ needs.playwright.result }}"
          code="${{ needs.changes.outputs.code }}"
          echo "suite=$suite code=$code"
          if [ "$suite" = "success" ]; then
            echo "E2E suite passed."
          elif [ "$suite" = "skipped" ] && [ "$code" != "true" ]; then
            echo "Docs-only PR — suite legitimately skipped."
          else
            echo "::error::E2E suite did not pass (result: $suite)."
            exit 1
          fi
