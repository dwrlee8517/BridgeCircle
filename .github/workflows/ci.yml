name: CI

# `CI gate` is the required branch-protection check. It always reports for PRs:
# green after lint/test/build pass, or green when a PR is legitimately
# docs-only and those expensive jobs are skipped. Pushes that touch only docs
# still skip this workflow because required checks apply at PR merge time.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'product-spec-obsidian-vault/**'
      - '.gitignore'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect docs-only PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "Changed files:"; echo "$files"
          non_docs=$(echo "$files" | grep -vE '(^docs/|^product-spec-obsidian-vault/|\.md$|^\.gitignore$)' || true)
          if [ -n "$non_docs" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: ESLint
        run: pnpm lint

      - name: Design-token ratchet
        run: pnpm check:tokens

      - name: Production cutover ratchet
        run: pnpm check:production-cutover

      - name: TypeScript
        run: pnpm tsc --noEmit

      - name: Vitest
        run: pnpm vitest run --passWithNoTests --coverage

      # Coverage is reported here, not gated — the ratchet floor is on the
      # integration tier. The artifact feeds the coverage-report job.
      - name: Upload unit coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: app/coverage/unit/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration (API-driven vs local stack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Same local stack the E2E job boots, minus the services no test needs.
      # Migrations apply here, so a PR whose migration contradicts the
      # provisioning writes fails in this job rather than in someone's shell.
      - name: Start local Supabase stack
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare

      # No Doppler token: unlike the E2E and build jobs, the integration
      # runner derives every value it needs from `supabase status` and
      # defaults PROVISION_SECRET to a local-only string, so this job holds
      # no secrets and cannot be pointed at a remote database.
      # --coverage arms the ratchet floor in vitest.integration.config.ts:
      # the run fails if coverage of the API surface drops below the committed
      # thresholds (collapse protection — e.g. a harness or alias change that
      # makes tests pass while instrumenting nothing).
      - name: Integration suite (with coverage ratchet)
        env:
          CI: 'true'
        run: pnpm test:int --coverage

      - name: Upload integration coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: app/coverage/integration/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

  # Renders the coverage dashboard: a table on the workflow run page, and a
  # sticky PR comment kept up to date in place (edited, never re-posted, so the
  # thread doesn't fill with stale numbers). Reporting only — the gate that can
  # fail a build is the ratchet inside the integration job.
  coverage-report:
    name: Coverage report
    needs: [changes, quality, integration]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # A tier whose job failed leaves no artifact; the renderer prints
      # "not run" for it rather than failing the report.
      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: app/coverage-artifacts
        continue-on-error: true

      - name: Render report
        run: |
          pnpm exec tsx scripts/coverage-report.ts \
            --tier "Unit=coverage-artifacts/coverage-unit/coverage-summary.json" \
            --tier "Integration=coverage-artifacts/coverage-integration/coverage-summary.json" \
            | tee coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- coverage-report -->'
            const body = marker + '\n' + fs.readFileSync('app/coverage-report.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  build:
    name: Build (validates types vs. migrations)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dopplerhq/cli-action@v3

      - run: pnpm install --frozen-lockfile

      # `next build` type-checks the whole codebase against
      # src/db/database.types.ts. If a migration in this PR removed or
      # renamed a column that app code still references, this fails here
      # — before the migration ever lands on prod.
      - name: Next build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          NODE_ENV: production
        run: doppler run --preserve-env=NODE_ENV -- pnpm build

  # `mobile/` installs independently of `app/` — there is no root
  # pnpm-workspace.yaml, because one would make pnpm walk up from `app/` and
  # switch to a root lockfile, breaking both this workflow's app-scoped jobs
  # and Railway (whose service root directory is `app/`). See mobile/README.md.
  mobile:
    name: Mobile (typecheck & export)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      # No simulator in CI (and no full Xcode on the dev Mac either), so a
      # successful Metro bundle is the strongest cheap signal that the app
      # still builds. Catches broken imports and bad native-module resolution.
      - name: Expo export
        run: pnpm export

  ci-gate:
    name: CI gate
    needs: [changes, quality, integration, build, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Report
        run: |
          code="${{ needs.changes.outputs.code }}"
          quality="${{ needs.quality.result }}"
          integration="${{ needs.integration.result }}"
          build="${{ needs.build.result }}"
          mobile="${{ needs.mobile.result }}"
          echo "code=$code quality=$quality integration=$integration build=$build mobile=$mobile"
          if [ "$quality" = "success" ] && [ "$integration" = "success" ] && [ "$build" = "success" ] && [ "$mobile" = "success" ]; then
            echo "CI quality, integration, build, and mobile jobs passed."
          elif [ "$code" != "true" ] && [ "$quality" = "skipped" ] && [ "$integration" = "skipped" ] && [ "$build" = "skipped" ] && [ "$mobile" = "skipped" ]; then
            echo "Docs-only PR — CI jobs legitimately skipped."
          else
            echo "::error::CI did not pass (quality: $quality, integration: $integration, build: $build, mobile: $mobile)."
            exit 1
          fi
