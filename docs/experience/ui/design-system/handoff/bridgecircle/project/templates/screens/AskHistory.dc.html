<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
  <script src="./account-menu.js"></script>
  <script src="./help-data.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow:hidden} a{color:var(--link);text-decoration:none} a:hover{color:var(--link-hover)} input,textarea,button{font-family:var(--font-sans)}</style>
</helmet>

<dc-import name="Shell" active="help" title="Your asks" backHref="./Help.dc.html" backLabel="Back to Help" meta="{{ slotLabel }}" bell="none" label="Help — your asks" hint-size="100%,100vh">

    <div style="flex:1;min-height:0;overflow-y:auto;background:var(--wash-page)">
      <div style="max-width:var(--container-reading);margin:0 auto;padding:28px 26px 40px">

        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
          <span style="font-size:15px;font-weight:800;letter-spacing:-0.02em">Open</span>
          <span style="font-size:12px;color:var(--text-faint);font-weight:600">slots return when an ask ends</span>
        </div>
        <div style="background:var(--surface-card-elevated);border-radius:18px;overflow:hidden;box-shadow:var(--ring-card-elevated),var(--shadow-card-elevated)">
          <sc-for list="{{ openAsks }}" as="a" hint-placeholder-count="4">
            <a href="{{ a.href }}" style="display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--divider-row);color:inherit;text-decoration:none;cursor:pointer" style-hover="background:var(--row-hover)" style-focus="outline:2px solid var(--focus-ring);outline-offset:-2px">
              <span style="flex:1;min-width:0">
                <span style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
                  <b style="font-size:14px;font-weight:700;color:var(--text-primary)">{{ a.title }}</b>
                  <sc-if value="{{ a.pillWaiting }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--text-secondary);background:var(--surface-subtle)">Waiting</span></sc-if>
                  <sc-if value="{{ a.pillOffers }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--blue-600);background:var(--blue-50)">{{ a.offersLabel }}</span></sc-if>
                  <sc-if value="{{ a.pillDeclined }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--text-secondary);background:var(--surface-subtle)">Declined</span></sc-if>
                  <sc-if value="{{ a.pillAnswered }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--action-give-text);background:var(--give-tint)">Answered</span></sc-if>
                  <sc-if value="{{ a.pillCloses }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--closing-soon-text);background:var(--closing-soon-tint)">{{ a.closesLabel }}</span></sc-if>
                </span>
                <span style="display:block;font-size:12.5px;color:var(--grey-600);font-weight:500;margin-top:2px">{{ a.meta }}</span>
              </span>
              <span aria-hidden="true" style="flex:none;color:var(--grey-400);font-size:16px;font-weight:700">&rsaquo;</span>
            </a>
          </sc-for>
        </div>

        <div style="display:flex;align-items:baseline;gap:8px;margin:26px 0 10px">
          <span style="font-size:15px;font-weight:800;letter-spacing:-0.02em">History</span>
          <span style="font-size:12px;color:var(--text-faint);font-weight:600">reachable, never nagging</span>
        </div>
        <div style="background:var(--surface-card-elevated);border-radius:18px;overflow:hidden;box-shadow:var(--ring-card-elevated),var(--shadow-card-elevated)">
          <sc-for list="{{ history }}" as="h" hint-placeholder-count="3">
            <a href="{{ h.href }}" style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--divider-row);color:inherit;text-decoration:none;cursor:pointer" style-hover="background:var(--row-hover)" style-focus="outline:2px solid var(--focus-ring);outline-offset:-2px">
              <span style="flex:1;min-width:0">
                <span style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
                  <b style="font-size:13.5px;font-weight:600;color:var(--text-secondary)">{{ h.text }}</b>
                  <sc-if value="{{ h.resolved }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--action-give-text);background:var(--give-tint)">Resolved</span></sc-if>
                  <sc-if value="{{ h.other }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;border-radius:var(--radius-pill);padding:2px 8px;color:var(--text-faint);background:var(--surface-subtle)">{{ h.end }}</span></sc-if>
                </span>
                <span style="display:block;font-size:12px;color:var(--text-faint);font-weight:500;margin-top:2px">{{ h.meta }}</span>
              </span>
              <span aria-hidden="true" style="flex:none;color:var(--grey-400);font-size:16px;font-weight:700">&rsaquo;</span>
            </a>
          </sc-for>
        </div>

      </div>
    </div>
  </dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sentAsks: [], overrides: {} };

  componentDidMount() {
    try {
      this.setState({
        sentAsks: (JSON.parse(sessionStorage.getItem('bcSentAsks') || '[]') || []).filter((a) => a && typeof a.text === 'string' && (a.kind === 'direct' || a.kind === 'open')),
        overrides: JSON.parse(sessionStorage.getItem('bcAskOverrides') || '{}')
      });
    } catch (e) { /* ignore corrupt state */ }
    if (!window.BCHelpData) {
      this._poll = setInterval(() => { if (window.BCHelpData) { clearInterval(this._poll); this._poll = null; this.forceUpdate(); } }, 80);
    }
  }

  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  data() { return window.BCHelpData || { yourAsks: [], historyAsks: [] }; }

  renderVals() {
    const s = this.state;
    const ov = s.overrides;
    const all = [...s.sentAsks, ...(this.data().yourAsks || [])];

    const live = all.filter((a) => {
      const st = (ov[a.id] && ov[a.id].status) || a.status;
      return st !== 'retracted';
    });

    const openAsks = live.map((a) => {
      const st = (ov[a.id] && ov[a.id].status) || a.status;
      const offersN = (a.offers || []).length;
      const meta = a.kind === 'direct'
        ? 'To ' + (a.to ? a.to.name : '') + ' \u00b7 sent ' + a.sent
        : (a.reach === 'school' ? 'Public \u2014 anyone at Chadwick' : 'Private \u2014 good matches') + (a.anon ? ' \u00b7 without your name' : '') + ' \u00b7 sent ' + a.sent;
      return {
        title: a.text.length > 60 ? a.text.slice(0, 60).trimEnd() + '\u2026' : a.text,
        meta,
        href: './AskStatus.dc.html?id=' + a.id,
        pillWaiting: st === 'waiting' || (st === 'quiet' && a.daysLeft > 3),
        pillOffers: st === 'offers' && offersN > 0,
        offersLabel: offersN === 1 ? '1 offer' : offersN + ' offers',
        pillDeclined: st === 'declined',
        pillAnswered: st === 'accepted',
        pillCloses: (st === 'quiet' || st === 'waiting' || st === 'offers') && a.daysLeft > 0 && a.daysLeft <= 3,
        closesLabel: 'Closes in ' + a.daysLeft + 'd'
      };
    });

    const retractedNow = all.filter((a) => ov[a.id] && ov[a.id].status === 'retracted').map((a) => ({
      text: a.text.length > 60 ? a.text.slice(0, 60).trimEnd() + '\u2026' : a.text,
      end: 'Retracted', meta: 'You retracted this \u00b7 just now',
      resolved: false, other: true,
      href: './AskStatus.dc.html?id=' + a.id
    }));

    const history = [...retractedNow, ...(this.data().historyAsks || []).map((h) => ({
      text: h.text, end: h.end, meta: h.meta,
      resolved: h.end === 'Resolved', other: h.end !== 'Resolved',
      href: './AskStatus.dc.html?id=' + h.id
    }))];

    const openN = live.filter((a) => {
      const st = (ov[a.id] && ov[a.id].status) || a.status;
      return st === 'waiting' || st === 'offers' || st === 'quiet' || st === 'accepted';
    }).length;

    return { openAsks, history, slotLabel: openN + ' of 5 open' };
  }
}
</script>
</body>
</html>
