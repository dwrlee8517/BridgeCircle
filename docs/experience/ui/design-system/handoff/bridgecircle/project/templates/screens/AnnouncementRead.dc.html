<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./ds-base.js"></script>
  <script src="./account-menu.js"></script>
  <script src="./school-data.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow:hidden} a{color:var(--link);text-decoration:none} a:hover{color:var(--link-hover)} input,textarea,button{font-family:var(--font-sans)}</style>
</helmet>

<dc-import name="Shell" active="school" title="Announcement" backClick="{{ goBack }}" bell="none" actionHref="./Announcements.dc.html" actionLabel="All announcements &rarr;" label="School — announcement" hint-size="100%,100vh">

    <div style="flex:1;min-height:0;overflow-y:auto;background:var(--wash-page)">
      <article style="max-width:var(--container-reading);margin:0 auto;padding:36px 26px 56px">
        <p style="margin:0;font-size:12.5px;font-weight:700;color:var(--blue-600)">{{ annTag }} <span style="color:var(--text-faint);font-weight:600">&middot; {{ annDate }}</span></p>
        <h1 style="margin:10px 0 0;font-size:26px;line-height:36px;font-weight:800;letter-spacing:-0.025em;text-wrap:pretty">{{ annTitle }}</h1>
        <p style="margin:18px 0 0;font-size:15px;line-height:1.75;color:var(--text-secondary);font-weight:500;white-space:pre-line;text-wrap:pretty">{{ annBody }}</p>
        <p style="margin:28px 0 0;border-top:1px solid var(--divider-row);padding-top:14px;font-size:12px;color:var(--text-faint);font-weight:500">From the Alumni Office &middot; sent to all members</p>
      </article>
    </div>
  </dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    // Marked read on arrival (FLOWS §6-detail).
    const mark = () => {
      const a = this.ann();
      if (!a) return false;
      try {
        const read = JSON.parse(sessionStorage.getItem('bcAnnRead') || '{}');
        if (!read[a.id]) { read[a.id] = true; sessionStorage.setItem('bcAnnRead', JSON.stringify(read)); }
      } catch (e) { /* ignore */ }
      return true;
    };
    if (!mark()) {
      this._poll = setInterval(() => { if (window.BCSchoolData) { clearInterval(this._poll); this._poll = null; mark(); this.forceUpdate(); } }, 80);
    }
  }

  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  ann() {
    const anns = (window.BCSchoolData || {}).announcements || [];
    let id = null;
    try { id = new URLSearchParams(window.location.search).get('id'); } catch (e) { /* ignore */ }
    return anns.find((a) => a.id === id) || anns[0] || null;
  }

  renderVals() {
    const a = this.ann();
    return {
      goBack: () => { if (window.history.length > 1) window.history.back(); else window.location.href = './School.dc.html'; },
      annTag: a ? a.tag : '',
      annDate: a ? a.date : '',
      annTitle: a ? a.title : '',
      annBody: a ? a.body : ''
    };
  }
}
</script>
</body>
</html>
