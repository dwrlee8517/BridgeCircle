<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- Screen: Notifications page — The durable list behind the bell popover (FLOWS §7d) — every notification in reverse-chron, each deep-linking to its target; read-state clears the bell dot. No section lit: a deep-link surface, not a sixth root. -->
<helmet>
  <script src="./ds-base.js"></script>
  <script src="./account-menu.js"></script>
  <script src="./notifications-data.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow:hidden} a{color:var(--link);text-decoration:none} a:hover{color:var(--link-hover)} input,textarea,button{font-family:var(--font-sans)}</style>
</helmet>

<dc-import name="Shell" active="none" title="Notifications" bell="current" label="Notifications" hint-size="100%,100vh">

    <div style="flex:1;min-height:0;overflow-y:auto;background:var(--wash-page)">
      <div style="max-width:var(--container-reading);margin:0 auto;padding:26px 24px 40px;display:grid;gap:14px">

        <div style="display:flex;align-items:flex-end;gap:12px">
          <div style="flex:1">
            <h1 style="margin:0;font-weight:800;font-size:28px;letter-spacing:-0.03em">Notifications</h1>
            <p style="margin:6px 0 0;font-size:13px;color:var(--grey-600);font-weight:500">{{ subLine }}</p>
          </div>
          <sc-if value="{{ markAllShow }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ markAll }}" style="flex:none;border:0;background:var(--surface-card);box-shadow:var(--ring-outline);color:var(--text-secondary);border-radius:var(--radius-pill);padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer" style-hover="background:var(--surface-subtle)" style-focus="outline:2px solid var(--focus-ring);outline-offset:2px">Mark all read</button>
          </sc-if>
        </div>

        <div style="background:var(--surface-card-elevated);border-radius:var(--radius-card-xl);overflow:hidden;box-shadow:var(--ring-card-elevated),var(--shadow-card-elevated)">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
            <sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
              <div style="padding:14px 20px 8px;border-top:1px solid var(--divider-row)"><b style="font-size:12px;font-weight:800;letter-spacing:0.02em;color:var(--text-faint)">{{ r.label }}</b></div>
            </sc-if>
            <sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}">
              <a href="{{ r.href }}" onClick="{{ r.markRead }}" style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--divider-row);color:inherit;text-decoration:none;cursor:pointer" style-hover="background:var(--row-hover)" style-focus="outline:2px solid var(--focus-ring);outline-offset:-2px">
                <sc-if value="{{ r.av1 }}" hint-placeholder-val="{{ true }}"><span style="width:38px;height:38px;flex:none;border-radius:50%;background:var(--avatar-1-bg);color:var(--avatar-1-fg);box-shadow:var(--ring-avatar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ r.i }}</span></sc-if>
                <sc-if value="{{ r.av2 }}" hint-placeholder-val="{{ false }}"><span style="width:38px;height:38px;flex:none;border-radius:50%;background:var(--avatar-2-bg);color:var(--avatar-2-fg);box-shadow:var(--ring-avatar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ r.i }}</span></sc-if>
                <sc-if value="{{ r.av3 }}" hint-placeholder-val="{{ false }}"><span style="width:38px;height:38px;flex:none;border-radius:50%;background:var(--avatar-3-bg);color:var(--avatar-3-fg);box-shadow:var(--ring-avatar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ r.i }}</span></sc-if>
                <sc-if value="{{ r.av4 }}" hint-placeholder-val="{{ false }}"><span style="width:38px;height:38px;flex:none;border-radius:50%;background:var(--avatar-4-bg);color:var(--avatar-4-fg);box-shadow:var(--ring-avatar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ r.i }}</span></sc-if>
                <sc-if value="{{ r.av5 }}" hint-placeholder-val="{{ false }}"><span style="width:38px;height:38px;flex:none;border-radius:50%;background:var(--avatar-5-bg);color:var(--avatar-5-fg);box-shadow:var(--ring-avatar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">{{ r.i }}</span></sc-if>
                <sc-if value="{{ r.isEvent }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:38px;height:38px;border-radius:var(--radius-comfortable);background:linear-gradient(180deg,var(--selected-tint),#e2eeff);box-shadow:inset 0 0 0 1px rgb(49 130 246 / 0.16);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1"><span style="font-size:8.5px;font-weight:800;color:var(--blue-600);letter-spacing:0.05em">{{ r.mo }}</span><span style="font-size:14px;font-weight:800;color:var(--text-primary)">{{ r.dd }}</span></span></sc-if>
                <sc-if value="{{ r.isSystem }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:38px;height:38px;border-radius:var(--radius-comfortable);background:var(--closing-soon-tint);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--closing-soon-text);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span></sc-if>
                <span style="flex:1;min-width:0">
                  <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ true }}"><span style="display:block;font-size:13.5px;font-weight:800;line-height:1.4;color:var(--text-primary)">{{ r.actor }} <span style="font-weight:600">{{ r.line }}</span></span></sc-if>
                  <sc-if value="{{ r.isRead }}" hint-placeholder-val="{{ false }}"><span style="display:block;font-size:13.5px;font-weight:700;line-height:1.4;color:var(--text-primary)">{{ r.actor }} <span style="font-weight:500;color:var(--text-secondary)">{{ r.line }}</span></span></sc-if>
                  <sc-if value="{{ r.subShow }}" hint-placeholder-val="{{ true }}"><span style="display:block;font-size:12px;color:var(--text-faint);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span></sc-if>
                </span>
                <span style="flex:none;font-size:11px;color:var(--text-faint);font-weight:600;font-variant-numeric:tabular-nums">{{ r.when }}</span>
                <sc-if value="{{ r.unread }}" hint-placeholder-val="{{ true }}"><i style="flex:none;width:8px;height:8px;border-radius:50%;background:var(--action-primary)"></i></sc-if>
              </a>
            </sc-if>
          </sc-for>
        </div>

        <p style="margin:0;text-align:center;font-size:12px;color:var(--text-faint);font-weight:500">That&rsquo;s everything. The bell taps your shoulder once &mdash; this page keeps the record.</p>

      </div>
    </div>
  </dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { read: {} };

  componentDidMount() {
    try { this.setState({ read: JSON.parse(sessionStorage.getItem('bcNotifRead') || '{}') }); } catch (e) { /* ignore */ }
    if (!window.BCNotifData) {
      this._poll = setInterval(() => { if (window.BCNotifData) { clearInterval(this._poll); this._poll = null; this.forceUpdate(); } }, 80);
    }
  }

  componentWillUnmount() { if (this._poll) clearInterval(this._poll); }

  saveRead(read) {
    this.setState({ read });
    try { sessionStorage.setItem('bcNotifRead', JSON.stringify(read)); } catch (e) { /* ignore */ }
  }

  renderVals() {
    const items = (window.BCNotifData && window.BCNotifData.items) || [];
    const read = this.state.read;
    const isRead = (n) => n.read || !!read[n.id];

    const rows = [];
    let day = null;
    for (const n of items) {
      if (n.day !== day) {
        day = n.day;
        rows.push({ isHeader: true, isItem: false, label: day });
      }
      rows.push({
        isHeader: false, isItem: true,
        href: n.href, when: n.when,
        actor: n.actor, line: n.line || '',
        subShow: !!n.sub, sub: n.sub || '',
        unread: !isRead(n), isRead: isRead(n),
        i: n.i || '',
        av1: n.kind === 'person' && n.av === 1, av2: n.kind === 'person' && n.av === 2,
        av3: n.kind === 'person' && n.av === 3, av4: n.kind === 'person' && n.av === 4,
        av5: n.kind === 'person' && n.av === 5,
        isEvent: n.kind === 'event', mo: n.mo || '', dd: n.dd || '',
        isSystem: n.kind === 'system',
        markRead: () => this.saveRead({ ...this.state.read, [n.id]: true })
      });
    }

    const unreadN = items.filter((n) => !isRead(n)).length;

    return {
      rows,
      subLine: unreadN > 0
        ? unreadN + ' unread \u00b7 each one links to where it happened'
        : 'You\u2019re caught up \u00b7 each one links to where it happened',
      markAllShow: unreadN > 0,
      markAll: () => {
        const all = { ...this.state.read };
        for (const n of items) all[n.id] = true;
        this.saveRead(all);
      }
    };
  }
}
</script>
</body>
</html>
